<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" fill="none">
  <defs>
    <linearGradient id="line" x1="370" y1="120" x2="1240" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75C8FF"/>
      <stop offset=".52" stop-color="#E9F5FF"/>
      <stop offset="1" stop-color="#FFC247"/>
    </linearGradient>
    <linearGradient id="page" x1="800" y1="505" x2="800" y2="644" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF1C7" stop-opacity=".85"/>
      <stop offset="1" stop-color="#FFC247" stop-opacity=".12"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#FFC247" stop-opacity=".34"/>
      <stop offset="1" stop-color="#FFC247" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .light-pulse { animation: light-pulse 2.8s ease-in-out infinite alternate; }
    .light-pulse.delay-one { animation-delay: -1.2s; }
    .light-pulse.delay-two { animation-delay: -2.1s; }
    @keyframes light-pulse {
      from { opacity: .35; transform: scale(.72); }
      to { opacity: 1; transform: scale(1.65); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>

